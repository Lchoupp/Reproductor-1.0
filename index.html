<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Reproductor de Música PWA</title>
    
    <!-- PWA Config & Theme -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1db954">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon2_512.png">

    <!-- Estilos Externos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Pantalla de Carga (Splash Screen) -->
    <div id="splash-screen">
        <div class="splash-contenido">
            <i class="fa-solid fa-music splash-icono"></i>
            <h1>Reproductor</h1>
        </div>
    </div>

    <!-- Contenedor Principal / Reproductor -->
    <main id="player" class="hidden">
        
        <!-- VISTA REPRODUCTOR -->
        <section id="vista-reproductor" class="contenedor-reproductor">
            <header class="encabezado-app">
                <button id="btn-ir-ecualizador" class="btn-icono" title="Ecualizador">
                    <i class="fa-solid fa-sliders"></i>
                </button>
                <h2>Reproduciendo</h2>
                <button id="btn-temporizador" class="btn-icono" title="Temporizador">
                    <i class="fa-solid fa-clock"></i>
                    <span id="texto-temporizador">Temporizador</span>
                </button>
            </header>

            <!-- Buscador y Selección de Carpeta -->
            <div class="seccion-busqueda">
                <input type="text" id="buscador" placeholder="Buscar canción...">
                <ul id="lista-resultados" class="lista-busqueda oculto"></ul>
            </div>

            <div id="contenedor-filtro-carpeta" class="seccion-filtro oculto">
                <label for="select-carpeta"><i class="fa-solid fa-folder"></i> Carpetas:</label>
                <select id="select-carpeta">
                    <option value="todas">Todas las canciones</option>
                </select>
            </div>

            <div class="control-cargar">
                <label for="cargar-carpeta" class="btn-cargar">
                    <i class="fa-solid fa-folder-open"></i> Seleccionar Carpeta
                </label>
                <input type="file" id="cargar-carpeta" webkitdirectory directory multiple accept="audio/*">
            </div>

            <!-- Carátula e Información de la Canción -->
            <div class="tarjeta-caratula">
                <img id="imagen-caratula" src="wave.svg" alt="Carátula de canción">
            </div>

            <div class="detalles-cancion">
                <h3 id="titulo-cancion">Selecciona una carpeta</h3>
                <p id="artista-cancion">Sin artista</p>
                <span id="contador">0 / 0</span>
            </div>

            <!-- Barra de Progreso y Tiempos -->
            <div class="seccion-progreso">
                <input type="range" id="progreso" value="0" min="0" step="0.1">
                <div class="tiempos">
                    <span id="tiempo-actual">0:00</span>
                    <span id="tiempo-total">0:00</span>
                </div>
            </div>

            <!-- Controles Principales -->
            <div class="controles-reproduccion">
                <button id="btn-aleatorio" class="btn-secundario" title="Aleatorio">
                    <i class="fa-solid fa-shuffle"></i>
                </button>
                <button id="btn-anterior" class="btn-control" title="Anterior">
                    <i class="fa-solid fa-backward-step"></i>
                </button>
                <button id="btn-reproducir" class="btn-principal" title="Reproducir / Pausar">
                    <i id="icono-ctrl" class="fa-solid fa-play"></i>
                </button>
                <button id="btn-siguiente" class="btn-control" title="Siguiente">
                    <i class="fa-solid fa-forward-step"></i>
                </button>
                <button id="btn-repetir" class="btn-secundario" title="Repetir">
                    <i class="fa-solid fa-repeat"></i>
                </button>
            </div>

            <!-- Control de Volumen -->
            <div class="seccion-volumen">
                <i id="icono-volumen" class="fa-solid fa-volume-high"></i>
                <input type="range" id="volumen" min="0" max="1" step="0.01" value="1">
            </div>

            <!-- Lista de Reproducción -->
            <div class="seccion-playlist">
                <h4>Lista de reproducción</h4>
                <ul id="lista-canciones"></ul>
            </div>
        </section>

        <!-- VISTA ECUALIZADOR -->
        <section id="vista-ecualizador" class="contenedor-reproductor oculto">
            <header class="encabezado-app">
                <button id="btn-volver-reproductor" class="btn-icono">
                    <i class="fa-solid fa-arrow-left"></i>
                </button>
                <h2>Ecualizador</h2>
                <div class="switch-power">
                    <input type="checkbox" id="eq-power" checked>
                    <label for="eq-power"></label>
                </div>
            </header>

            <div class="presets-container">
                <label for="select-preset">Preajustes:</label>
                <select id="select-preset">
                    <option value="flat">Plano / Normal</option>
                    <option value="bass">Bass Boost</option>
                    <option value="rock">Rock</option>
                    <option value="pop">Pop</option>
                    <option value="techno">Techno</option>
                    <option value="vocal">Vocal</option>
                </select>
            </div>

            <div class="bandas-ecualizador">
                <div class="banda">
                    <span id="val-60">0dB</span>
                    <input type="range" class="eq-banda" min="-12" max="12" value="0" step="0.5" orient="vertical">
                    <label>60Hz</label>
                </div>
                <div class="banda">
                    <span id="val-230">0dB</span>
                    <input type="range" class="eq-banda" min="-12" max="12" value="0" step="0.5" orient="vertical">
                    <label>230Hz</label>
                </div>
                <div class="banda">
                    <span id="val-910">0dB</span>
                    <input type="range" class="eq-banda" min="-12" max="12" value="0" step="0.5" orient="vertical">
                    <label>910Hz</label>
                </div>
                <div class="banda">
                    <span id="val-4000">0dB</span>
                    <input type="range" class="eq-banda" min="-12" max="12" value="0" step="0.5" orient="vertical">
                    <label>4kHz</label>
                </div>
                <div class="banda">
                    <span id="val-14000">0dB</span>
                    <input type="range" class="eq-banda" min="-12" max="12" value="0" step="0.5" orient="vertical">
                    <label>14kHz</label>
                </div>
            </div>

            <div class="extra-boost">
                <label for="eq-bass-extra">Graves Extra:</label>
                <input type="range" id="eq-bass-extra" min="0" max="10" value="0" step="0.5">
            </div>
        </section>

    </main>

    <!-- Modal de Temporizador -->
    <div id="modal-temporizador" class="modal oculto">
        <div class="modal-contenido">
            <h3>Temporizador de Apagado</h3>
            <p>Minutos para detener reproducción:</p>
            <input type="number" id="minutos-temporizador" min="1" max="180" value="15">
            
            <div class="opciones-modo">
                <label>
                    <input type="radio" name="modo-apagado" value="inmediato" checked> Apagar inmediatamente al expirar
                </label>
                <label>
                    <input type="radio" name="modo-apagado" value="al_finalizar"> Esperar a que termine la canción
                </label>
            </div>

            <div class="modal-acciones">
                <button id="btn-cancelar-modal" class="btn-modal-secundario">Cancelar</button>
                <button id="btn-iniciar-temporizador" class="btn-modal-principal">Iniciar</button>
            </div>
        </div>
    </div>

    <!-- Scripts CDN y Aplicación -->
    <script src="https://cdn.jsdelivr.net/npm/music-metadata-browser@2.5.10/dist/music-metadata-browser.sinon.min.js"></script>
    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker registrado:', reg.scope))
                    .catch(err => console.error('Error al registrar SW:', err));
            });
        }
    </script>
</body>
</html>
